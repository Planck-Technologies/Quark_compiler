[tool.ruff]
# Target Python version
target-version = "py310"

# Enable Pyflakes (F) and pycodestyle (E, W) codes by default
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = []

# Allow autofix for all enabled rules (when using --fix)
fixable = ["ALL"]
unfixable = []

# Exclude common directories
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]

[tool.ruff.format]
# Enable formatting configuration compatible with Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"