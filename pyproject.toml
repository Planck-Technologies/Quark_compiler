[tool.ruff]
# Target Python version
target-version = "py310"

# Exclude common directories
exclude = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv"]

[tool.ruff.lint]
# Enable Pyflakes (F) and pycodestyle (E, W) codes by default
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E203", "E501"]

# Allow autofix for all enabled rules (when using --fix)
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Enable formatting configuration compatible with Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty]
# Configuration for Astral's ty type checker

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]
exclude = ["test"]
# To enforce strict checks, rules can be configured in [tool.ty.rules] if needed.

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = "."
addopts = "-v --cov=src --cov-report=term-missing"

[dependency-groups]
dev = [
    "networkx>=3.6.1",
]
